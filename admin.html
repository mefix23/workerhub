<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Панель — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  .adm-tabs, .adm-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .adm-chip {
    border: 1px solid var(--border-strong);
    background: var(--bg-elevated);
    color: var(--text-secondary);
    border-radius: var(--radius-full);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .adm-chip.active {
    border-color: var(--border-accent);
    background: var(--accent-muted);
    color: var(--accent-hover);
  }
  .adm-search { margin-bottom: 16px; }
  .adm-search input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-strong);
    background: var(--bg-input);
  }
  .adm-list { display: grid; gap: 10px; }
  .adm-row {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: grid;
    gap: 12px;
  }
  .adm-title { font-weight: 700; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .adm-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; word-break: break-word; }
  .adm-desc { color: var(--text-secondary); font-size: 13.5px; margin-top: 6px; }
  .adm-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .adm-badge {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
  }
  .adm-badge.admin { color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
  .adm-badge.mod { color: var(--accent-hover); border-color: var(--border-accent); }
  .adm-badge.bad { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
  .adm-badge.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.35); }
  .adm-danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.35); }
  .adm-gate { max-width: 460px; margin: 0 auto; }
</style>
</head>
<body>
<div id="nav-root"></div>

<section class="section">
  <div class="container" id="admin-root">
    <div class="loading">Загрузка…</div>
  </div>
</section>

<footer class="footer">
  <div class="container">WORKERHUB · MVP</div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
