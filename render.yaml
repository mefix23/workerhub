services:
  - type: web
    name: workerhub
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_FILE
        value: ./database/workerhub.sqlite
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: WITHDRAWAL_HOLD_DAYS
        value: "3"
      - key: ADMIN_SETUP_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      # Backups of the database (see README / instructions): set these in Render -> Environment.
      - key: BACKUP_GITHUB_REPO
        sync: false
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: BACKUP_KEY
        sync: false
