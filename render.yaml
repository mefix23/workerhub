services:
  - type: web
    name: workerhub
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_FILE
        value: ./database/workerhub.sqlite
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: WITHDRAWAL_HOLD_DAYS
        value: "3"
      - key: SEED_DEMO_DATA
        value: "true"
