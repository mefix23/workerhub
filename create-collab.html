<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Выложить коллаб — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div id="nav-root"></div>

<section class="section">
  <div class="container">

    <div id="auth-gate" class="form-card center" style="display:none;">
      <h2 class="mt-0">Нужно войти</h2>
      <p class="text-muted">Чтобы выложить коллаб, сначала войди в аккаунт.</p>
      <div class="hero-actions" style="justify-content:center;">
        <a href="/login.html" class="btn btn-primary">Войти</a>
        <a href="/register.html" class="btn">Регистрация</a>
      </div>
    </div>

    <div id="form-wrap" style="display:none;">
      <div class="section-head">
        <div>
          <h2>Выложить коллаб (GP)</h2>
          <p>Укажи цену за каждую стадию готовности GP-части. Купить можно будет любую доступную стадию — от 10% до 100%.</p>
        </div>
      </div>

      <form id="collab-form" class="form-card">
        <div id="collab-msg" class="form-msg"></div>

        <div class="field">
          <label>Название</label>
          <input type="text" name="title" required maxlength="120" placeholder="например, Layout part 3 — Cube/Ship" />
        </div>

        <div class="field">
          <label>Описание</label>
          <textarea name="description" required rows="4" maxlength="4000" placeholder="Стиль, сложность, что уже сделано"></textarea>
        </div>

        <div class="field">
          <label>Цены по стадиям GP <span class="hint">₽ за каждую стадию</span></label>
          <div id="gp-tier-fields"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Опубликовать коллаб</button>
      </form>
    </div>

  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/create-collab.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
