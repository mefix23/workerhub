<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Сообщения — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  .chat-shell {
    max-width: var(--max-width);
    margin: 20px auto 48px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 16px;
    height: calc(100vh - var(--nav-height) - 100px);
    min-height: 420px;
  }
  .chat-list, .chat-pane {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .chat-list-head, .chat-pane-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .chat-list-body { overflow-y: auto; flex: 1; }
  .chat-row {
    display: block; padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .chat-row:hover, .chat-row.active { background: var(--bg-elevated); }
  .chat-row-name { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .chat-row-preview { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-badge {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chat-msgs {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .chat-bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  }
  .chat-bubble.me {
    align-self: flex-end;
    background: rgba(59, 130, 246, 0.22);
    border: 1px solid rgba(59, 130, 246, 0.35);
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.them {
    align-self: flex-start;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-bottom-left-radius: 4px;
  }
  .chat-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .chat-compose {
    display: flex; gap: 8px; padding: 12px 14px;
    border-top: 1px solid var(--border); background: var(--bg-elevated);
  }
  .chat-compose textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 120px;
    padding: 10px 12px; border-radius: var(--radius-md);
    border: 1px solid var(--border-strong); background: var(--bg-input);
  }
  .chat-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); padding: 24px; text-align: center;
  }
  @media (max-width: 760px) {
    .chat-shell {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
    }
    .chat-list { max-height: 240px; }
    .chat-pane { min-height: 420px; height: 60vh; }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="chat-shell" id="chat-root">
  <div class="loading" style="grid-column:1/-1;">Загрузка…</div>
</div>

<footer class="footer">
  <div class="container">WORKERHUB · MVP</div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/messages.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
