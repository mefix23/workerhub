<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Профиль — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  .works-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .work-tile {
    position: relative;
    aspect-ratio: 9/16;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    background: #0a0a0c;
    cursor: pointer;
  }
  .work-tile video, .work-tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .work-tile-meta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 10px; font-size: 12px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
  }
  .upload-modal {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.65); padding: 16px;
  }
  .upload-modal.open { display: flex; }
  .upload-card {
    width: 100%; max-width: 440px; background: var(--bg-card);
    border: 1px solid var(--border-strong); border-radius: 16px; padding: 22px;
  }
  .notif-item {
    padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .notif-item.unread { color: #fff; }
</style>
</head>
<body>
<div id="nav-root"></div>

<section class="section">
  <div class="container" id="user-root">
    <div class="loading">Загрузка…</div>
  </div>
</section>

<div class="upload-modal" id="upload-modal">
  <div class="upload-card">
    <h2 class="mt-0" style="margin-top:0;">Выложить видео</h2>
    <p class="text-muted" style="font-size:13.5px;">MP4 / WebM / MOV до 40 МБ, или ссылка на видео / YouTube.</p>
    <div class="field">
      <label>Файл</label>
      <input type="file" id="work-file" accept="video/mp4,video/webm,video/quicktime,video/*" />
    </div>
    <div class="field">
      <label>Или ссылка</label>
      <input type="url" id="work-url" placeholder="https://..." maxlength="500" />
    </div>
    <div class="field">
      <label>Подпись</label>
      <textarea id="work-caption" rows="2" maxlength="300" placeholder="Коротко о ворке…"></textarea>
    </div>
    <div id="upload-msg" class="form-msg"></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-primary" id="upload-send">Опубликовать</button>
      <button class="btn" id="upload-cancel">Отмена</button>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">WORKERHUB · MVP</div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/cards.js"></script>
<script src="/js/user.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
