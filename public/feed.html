<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Лента ворков — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  body.feed-page { overflow: hidden; }
  .feed-shell {
    position: fixed;
    inset: var(--nav-height) 0 0 0;
    background: #000;
    z-index: 5;
  }
  .feed-track {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .feed-track::-webkit-scrollbar { display: none; }
  .feed-item {
    position: relative;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
  }
  .feed-video, .feed-iframe {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .feed-iframe { border: 0; }
  .feed-side {
    position: absolute;
    right: 14px;
    bottom: 120px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    z-index: 3;
  }
  .feed-action {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(20,20,22,0.72);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; backdrop-filter: blur(8px);
    transition: transform 0.2s, background 0.2s;
  }
  .feed-action:hover { transform: scale(1.06); background: rgba(40,40,44,0.85); }
  .feed-action.liked { color: #f472b6; border-color: rgba(244,114,182,0.5); }
  .feed-action span {
    font-size: 11px; font-weight: 600; margin-top: 2px; color: #e4e4e7;
  }
  .feed-meta {
    position: absolute;
    left: 16px; right: 80px; bottom: 28px;
    z-index: 3;
    color: #f4f4f5;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .feed-author {
    font-weight: 700; font-size: 15px; margin-bottom: 6px;
  }
  .feed-author a { color: #fff; }
  .feed-caption {
    font-size: 14px; line-height: 1.4; color: #e4e4e7;
    max-height: 4.2em; overflow: hidden;
  }
  .feed-empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; color: #a1a1aa; text-align: center; padding: 24px;
  }
  .feed-close {
    position: fixed; top: calc(var(--nav-height) + 12px); left: 16px; z-index: 10;
  }
  /* comments sheet */
  .feed-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-height: 55vh; background: var(--bg-card);
    border-radius: 20px 20px 0 0; border: 1px solid var(--border-strong);
    border-bottom: none; display: flex; flex-direction: column;
    transform: translateY(110%); transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .feed-sheet.open { transform: translateY(0); }
  .feed-sheet-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; font-weight: 700;
  }
  .feed-sheet-body { overflow-y: auto; flex: 1; padding: 12px 16px; }
  .feed-sheet-compose {
    display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border);
  }
  .feed-sheet-compose input {
    flex: 1; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--border-strong); background: var(--bg-input);
  }
  .cmt {
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .cmt-name { font-weight: 600; margin-right: 6px; }
  .cmt-time { font-size: 11px; color: var(--text-muted); }
  .feed-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 15;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .feed-backdrop.open { opacity: 1; pointer-events: auto; }
  @media (min-width: 900px) {
    .feed-item { max-width: 480px; margin: 0 auto; }
    .feed-track { scroll-padding: 0; }
  }
</style>
</head>
<body class="feed-page">
<div id="nav-root"></div>
<a href="/" class="btn btn-sm feed-close">← Назад</a>
<div class="feed-shell">
  <div class="feed-track" id="feed-track">
    <div class="feed-empty">Загрузка…</div>
  </div>
</div>
<div class="feed-backdrop" id="cmt-backdrop"></div>
<div class="feed-sheet" id="cmt-sheet">
  <div class="feed-sheet-head">
    <span>Комментарии</span>
    <button class="btn btn-sm btn-ghost" id="cmt-close">Закрыть</button>
  </div>
  <div class="feed-sheet-body" id="cmt-list"></div>
  <div class="feed-sheet-compose">
    <input type="text" id="cmt-input" maxlength="500" placeholder="Напиши комментарий…" />
    <button class="btn btn-primary" id="cmt-send">Отправить</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/feed.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
