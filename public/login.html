<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div id="nav-root"></div>

<section class="section">
  <div class="container">
    <form id="login-form" class="form-card">
      <h2 class="mt-0">Вход</h2>
      <div id="auth-msg" class="form-msg"></div>

      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="••••••••" />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Войти</button>
      <p class="text-muted center" style="margin-bottom:0;font-size:13px;">
        Нет аккаунта? <a href="/register.html" style="font-weight:600;">Зарегистрироваться</a>
      </p>
    </form>
  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/pw-toggle.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
