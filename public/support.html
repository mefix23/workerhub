<style>
  .sup-list { display: grid; gap: 10px; margin-top: 12px; }
  .sup-row { display: block; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .sup-row b { display: block; margin-bottom: 4px; }
  .sup-msg { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg-card); }
  .sup-msg.staff { border-color: var(--border-accent); background: var(--accent-muted); }
  .sup-meta { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; }
  .sup-form textarea, .sup-form input { width: 100%; }
  .sup-pill { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-secondary); margin-left: 6px; }
  .sup-pill.warn { color: #fbbf24; border-color: rgba(245,158,11,.4); }
  .sup-pill.ok { color: #86efac; border-color: rgba(34,197,94,.35); }
</style>
