<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Общий чат — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  .lobby-wrap {
    max-width: 720px;
    margin: 20px auto 48px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--nav-height) - 80px);
    min-height: 420px;
  }
  .lobby-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .lobby-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .lobby-head h1 { font-size: 18px; margin: 0; }
  .lobby-msgs {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .lobby-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
  }
  .lobby-msg.me {
    align-self: flex-end;
    background: rgba(59, 130, 246, 0.15);
    border-color: rgba(59, 130, 246, 0.3);
  }
  .lobby-msg-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-hover);
    margin-bottom: 4px;
  }
  .lobby-msg-body { font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .lobby-msg-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .lobby-compose {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-elevated);
  }
  .lobby-compose input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: var(--bg-input);
  }
  .lobby-empty { color: var(--text-muted); text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="lobby-wrap">
  <div class="lobby-card">
    <div class="lobby-head">
      <div>
        <h1>Общий чат</h1>
        <p class="text-muted" style="margin:4px 0 0;font-size:13px;">Один канал для всех · будь вежлив</p>
      </div>
      <a class="btn btn-sm" href="/messages.html">Личные →</a>
    </div>
    <div class="lobby-msgs" id="lobby-msgs">
      <div class="lobby-empty">Загрузка…</div>
    </div>
    <div class="lobby-compose" id="lobby-compose">
      <input type="text" id="lobby-input" maxlength="500" placeholder="Напиши сообщение…" />
      <button class="btn btn-primary" id="lobby-send">Отправить</button>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">WORKERHUB · MVP</div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/lobby.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
