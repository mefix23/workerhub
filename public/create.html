<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Создать анкету — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div id="nav-root"></div>

<section class="section">
  <div class="container">

    <div id="auth-gate" class="form-card center" style="display:none;">
      <h2 class="mt-0">Нужно войти</h2>
      <p class="text-muted">Чтобы создать анкету, сначала войди в аккаунт или зарегистрируйся.</p>
      <div class="hero-actions" style="justify-content:center;">
        <a href="/login.html" class="btn btn-primary">Войти</a>
        <a href="/register.html" class="btn">Регистрация</a>
      </div>
    </div>

    <div id="create-form-wrap" style="display:none;">
      <div class="section-head">
        <div>
          <h2>Создать анкету</h2>
          <p>Расскажи, чем ты занимаешься — анкета будет опубликована сразу</p>
        </div>
      </div>

      <form id="create-form" class="form-card">
        <div id="create-msg" class="form-msg"></div>

        <div class="field">
          <label>Имя / ник</label>
          <input type="text" name="name" required maxlength="80" placeholder="например, mefix" />
        </div>

        <div class="field">
          <label>Роль <span class="hint">выбери одну или несколько</span></label>
          <div class="role-checkboxes" id="role-checkboxes"></div>
        </div>

        <div class="field">
          <label>Описание</label>
          <textarea name="description" required rows="5" maxlength="4000" placeholder="Расскажи, чем занимаешься и как работаешь"></textarea>
        </div>

        <div class="field">
          <label>Название <span class="hint">через запятую</span></label>
          <input type="text" name="services" placeholder="название анкеты, которое будет видно покупателям" />
        </div>

        <div class="field-row">
          <div class="field">
            <label>Цена <span class="hint">₽</span></label>
            <input type="number" name="price" required min="0" step="1" placeholder="500" />
          </div>
          <div class="field">
            <label>Контакт</label>
            <input type="text" name="contact" required maxlength="200" placeholder="@telegram или email" />
          </div>
        </div>

        <div class="field">
          <label>Аватар <span class="hint">ссылка на картинку, необязательно</span></label>
          <input type="url" name="avatarUrl" placeholder="https://example.com/avatar.png" />
        </div>

        <div class="field">
          <label>Портфолио <span class="hint">ссылки через запятую, необязательно</span></label>
          <input type="text" name="portfolio" placeholder="https://..., https://..." />
        </div>

        <div class="field">
          <label>Теги <span class="hint">через запятую</span></label>
          <input type="text" name="tags" placeholder="дизайн, логотип, брендинг" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Опубликовать анкету</button>
      </form>
    </div>

  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/create.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
