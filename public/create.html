<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Создать анкету — WORKERHUB</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div id="nav-root"></div>

<section class="section">
  <div class="container">

    <div id="auth-gate" class="form-card center" style="display:none;">
      <h2 class="mt-0">Нужно войти</h2>
      <p class="text-muted">Чтобы создать анкету, сначала войди в аккаунт или зарегистрируйся.</p>
      <div class="hero-actions" style="justify-content:center;">
        <a href="/login.html" class="btn btn-primary">Войти</a>
        <a href="/register.html" class="btn">Регистрация</a>
      </div>
    </div>

    <div id="create-form-wrap" style="display:none;">
      <div class="section-head">
        <div>
          <h2 id="form-title">Создать анкету</h2>
          <p id="form-sub">Сначала анкету проверяет модератор — в каталоге она появится после проверки</p>
        </div>
      </div>

      <form id="create-form" class="form-card">
        <div id="create-msg" class="form-msg"></div>

        <div class="field">
          <label>Имя / ник</label>
          <input type="text" name="name" required minlength="2" maxlength="80" placeholder="например, mefix" />
        </div>

        <div class="field">
          <label>Роль <span class="hint">выбери одну или несколько</span></label>
          <div class="role-checkboxes" id="role-checkboxes"></div>
        </div>

        <div class="field">
          <label>Название анкеты</label>
          <input type="text" name="title" required minlength="3" maxlength="80" placeholder="например: Дизайн логотипов и баннеров" />
        </div>

        <div class="field">
          <label>Описание <span class="hint">о себе и работе, необязательно</span></label>
          <textarea name="description" rows="4" maxlength="4000" placeholder="Кто ты, какой у тебя опыт"></textarea>
        </div>

        <div class="field">
          <label>Услуги <span class="hint">что именно ты делаешь, минимум 30 символов</span></label>
          <textarea name="servicesText" required minlength="30" rows="5" maxlength="4000" placeholder="Перечисли услуги, сроки и что входит в цену"></textarea>
        </div>

        <div class="field">
          <label>Фото / видео работ <span class="hint">от 1 до 5 в сумме</span></label>
          <div id="existing-media" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"></div>
          <input type="file" name="worksFiles" accept="image/png,image/jpeg,image/webp" multiple />
          <div id="works-count" class="text-muted" style="font-size:13px;margin-top:6px;"></div>
          <textarea name="videoLinks" rows="2" placeholder="Ссылки на видео (YouTube и т.п.), каждая с новой строки" style="margin-top:8px;"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Цена <span class="hint">₽</span></label>
            <input type="number" name="price" required min="0" step="1" placeholder="500" />
          </div>
          <div class="field">
            <label>Контакт</label>
            <input type="text" name="contact" required minlength="3" maxlength="200" placeholder="Telegram // discord" />
          </div>
        </div>

        <div class="field">
          <label>Аватар <span class="hint" id="avatar-hint">выбери картинку, необязательно</span></label>
          <input type="file" name="avatarFile" accept="image/png,image/jpeg,image/webp" />
        </div>

        <div class="field">
          <label>Теги <span class="hint">через запятую</span></label>
          <input type="text" name="tags" placeholder="дизайн, логотип, брендинг" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Отправить на модерацию</button>
      </form>
    </div>

  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/create.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
